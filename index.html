<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geomini:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
    input[type="text"], input[type="password"] {
        background-color: #fff08d;
        color:#000000;
        font-family: "Roboto", sans-serif;
    }
    h1 {
        color: #fff08d;
        font-family: "Roboto", sans-serif;
    }
    label {
        color: #fff08d;
        font-family: "Roboto", sans-serif;
    }
    body{
    background-image: url("BACKGROUND.png");
    font-family: "Roboto";
    border-radius: 10px;
    }
    .login-container {
    background-color: rgba(37, 42, 45);
    border-radius: 10px;
    padding: 20px;
    margin: 100px auto;
    width: 330px;
    height: 500px;
    }
    .logo {
    height:110px;
    width: 110px;
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    }
    </style>
    <title>Ace budgeting</title>
</head>
<body class="login-body">
    <div class="login-container">
        <h1><span class="ace">ACE</span> ROBOTICS</h1>
        <form action="/login" method="POST">
           <img src="ACE_ROBOTICS_NO_BG.png" alt="Logo" class="logo">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </body>
</html>
