<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"  type="text/css" href="loginstyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace budgeting</title>
</head>
<body class="login-body">
    <div class="login-container">
        <h1>Login</h1>
        <form action="/login" method="POST">
           <img src="ACE ROBOTICS LOGO.png" alt="Logo" class="logo">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
        <div id="auth-container">
            <button id="google-auth" onclick="loginWithGoogle()">Login with Google</button>
            <div id="user-profile" style="display: none;">
            <p>Welcome, <span id="user-name"></span>!</p>
            <button onclick="logout()">Logout</button>
        </div>
    </div>
     <script>
        // 3. Initialize Appwrite Client and Account
        const client = new Appwrite.Client()
            .setEndpoint('https://appwrite.io') // Change if using self-hosted
            .setProject('YOUR_PROJECT_ID');             // Replace with your Appwrite Project ID

        const account = new Appwrite.Account(client);

        // 4. Trigger Google Login Flow
        function loginWithGoogle() {
            const baseUrl = window.location.origin; // Matches localhost or your live domain dynamically

            account.createOAuth2Token(
                'google', 
                `${baseUrl}/`,  // Redirect back here on success
                `${baseUrl}/`   // Redirect back here on failure
            );
        }

        // 5. Check if user is already logged in on page load
        async function checkSession() {
            try {
                const user = await account.get();
                
                // If successful, show profile and hide login button
                document.getElementById('google-login-btn').style.display = 'none';
                document.getElementById('user-profile').style.display = 'block';
                document.getElementById('user-name').innerText = user.name;
                
                console.log("Logged in user details:", user);
            } catch (error) {
                // If it fails, user is just a guest (not logged in)
                console.log("No active user session.");
            }
        }

        // 6. Logout function
        async function logout() {
            try {
                await account.deleteSession('current');
                window.location.reload(); // Refresh page to reset UI
            } catch (error) {
                console.error("Logout failed", error);
            }
        }

        // Run session check when page loads
        checkSession();
    </script>
    </body>
</html>
