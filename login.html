
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<title>Login - ACEROBOTICS BUDGET</title>
		<meta name="description" content="Login page for ACEROBOTICS BUDGET">
		<link rel="icon" href="/favicon.ico">
		<style>
			/* Minimal page styling */
			html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f5f7fb}
			.center{display:flex;align-items:center;justify-content:center;height:100%}
			.card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,0.08);width:320px}
			.card h1{margin:0 0 16px;font-size:20px}
			.field{display:flex;flex-direction:column;margin-bottom:12px}
			input{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px}
			button{width:100%;padding:10px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
		</style>
	</head>
	<body>
		<div class="center">
			<main class="card" role="main">
				<h1>Sign in</h1>
				<form action="/login" method="post" autocomplete="on">
					<div class="field">
						<label for="email">Email</label>
						<input id="email" name="email" type="email" required>
					</div>
					<div class="field">
						<label for="password">Password</label>
						<input id="password" name="password" type="password" required>
					</div>
					<button type="submit">Log in</button>
				</form>
			</main>
		</div>
	</body>
</html>
